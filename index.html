<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPGジョブ占い｜あなたのジョブを診断しよう！</title>
<meta name="description" content="生年月日から、あなたのRPGジョブがわかる！勇者・魔法使い・魔王など16タイプ。自己理解の新しい体験。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple:#8b5cf6; --purple-l:#ede9fe; --purple-d:#6d28d9;
  --pink:#ec4899; --text:#2d1b69; --text-m:#7c6fa0;
  --bg:#faf7ff; --white:#fff; --r:22px;
}
body { background:var(--bg); color:var(--text); font-family:'M PLUS Rounded 1c',sans-serif; min-height:100vh; overflow-x:hidden; }
.deco { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.deco::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:rgba(196,181,253,.2); top:-180px; right:-180px; }
.deco::after { content:''; position:absolute; width:350px; height:350px; border-radius:50%; background:rgba(251,207,232,.22); bottom:-120px; left:-120px; }
.wrap { position:relative; z-index:1; max-width:500px; margin:0 auto; padding:40px 18px 80px; }
.hdr { text-align:center; margin-bottom:28px; }
.badge { display:inline-flex; align-items:center; gap:5px; background:var(--purple); color:#fff; font-size:10px; font-weight:800; letter-spacing:.12em; padding:5px 16px; border-radius:20px; margin-bottom:16px; }
.hdr h1 { font-size:clamp(28px,7vw,42px); font-weight:800; line-height:1.15; margin-bottom:10px; }
.hdr h1 em { color:var(--purple); font-style:normal; }
.sparks { display:flex; justify-content:center; gap:6px; margin:12px 0; font-size:20px; }
.hdr p { font-size:14px; color:var(--text-m); font-weight:500; line-height:1.7; }
.card { background:var(--white); border-radius:var(--r); padding:26px 22px; margin-bottom:14px; border:2.5px solid #c4b5fd; box-shadow:0 4px 0 #c4b5fd; }
.card-ttl { font-size:13px; font-weight:800; color:var(--purple); letter-spacing:.06em; margin-bottom:18px; text-align:center; }
.fg { display:grid; grid-template-columns:2fr 1fr 1fr; gap:9px; margin-bottom:18px; }
.fgr label { display:block; font-size:11px; font-weight:700; color:var(--text-m); letter-spacing:.05em; margin-bottom:5px; text-align:center; }
.fgr select { width:100%; background:#f5f0ff; border:2px solid #c4b5fd; border-radius:13px; color:var(--text); font-family:'M PLUS Rounded 1c',sans-serif; font-size:15px; font-weight:700; padding:10px 6px; outline:none; appearance:none; cursor:pointer; text-align:center; transition:border-color .15s; }
.fgr select:focus { border-color:var(--purple); }
.btn-go { width:100%; background:var(--purple); border:none; border-radius:14px; color:#fff; font-family:'M PLUS Rounded 1c',sans-serif; font-size:17px; font-weight:800; padding:15px; cursor:pointer; letter-spacing:.04em; box-shadow:0 5px 0 var(--purple-d); transition:all .1s; position:relative; top:0; }
.btn-go:hover { background:#7c3aed; }
.btn-go:active { top:3px; box-shadow:0 2px 0 var(--purple-d); }
.err { display:none; color:var(--pink); font-size:13px; font-weight:700; text-align:center; margin-top:11px; }
.res-wrap { display:none; animation:pop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from{opacity:0;transform:scale(.85) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
.res-card { background:var(--white); border-radius:var(--r); padding:30px 22px 26px; margin-bottom:14px; text-align:center; border:2.5px solid; box-shadow:0 5px 0; }
.res-lbl { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.14em; padding:4px 14px; border-radius:20px; margin-bottom:14px; }
.res-chara { width:160px; height:160px; object-fit:contain; margin:0 auto 12px; display:block; filter:drop-shadow(0 4px 12px rgba(0,0,0,.15)); }
.res-chara-fallback { font-size:72px; display:block; margin:0 auto 12px; line-height:1; }
.res-nm { font-size:36px; font-weight:800; margin-bottom:8px; letter-spacing:-.01em; }
.res-tg { font-size:13px; color:var(--text-m); font-weight:500; line-height:1.6; margin-bottom:18px; }
.res-hr { height:2.5px; border-radius:2px; margin:0 auto 18px; width:40px; }
.res-dc { font-size:14px; color:var(--text); line-height:1.9; text-align:left; font-weight:500; margin-bottom:18px; background:var(--bg); border-radius:14px; padding:14px; }
.traits { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:22px; }
.trait { font-size:12px; font-weight:700; padding:5px 13px; border-radius:20px; }
.cta { background:#f5f0ff; border:2px solid #c4b5fd; border-radius:18px; padding:20px; text-align:center; }
.cta p { font-size:13px; font-weight:700; color:var(--text-m); line-height:1.7; margin-bottom:14px; }
.btn-n { display:block; background:var(--purple); color:#fff; font-family:'M PLUS Rounded 1c',sans-serif; font-size:14px; font-weight:800; padding:13px; border-radius:13px; text-decoration:none; text-align:center; box-shadow:0 4px 0 var(--purple-d); margin-bottom:9px; cursor:pointer; border:none; width:100%; letter-spacing:.03em; }
.btn-n:hover { background:#7c3aed; }
.btn-r { display:block; background:transparent; color:var(--purple); font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; font-weight:700; padding:11px; border-radius:13px; text-align:center; border:2px solid #c4b5fd; cursor:pointer; width:100%; }
.btn-r:hover { border-color:var(--purple); }
.foot { text-align:center; font-size:12px; color:var(--text-m); font-weight:500; line-height:1.8; margin-top:26px; }
@media(max-width:380px){
  .wrap{padding:28px 12px 60px;}
  .fg{grid-template-columns:1fr 1fr;}
  .fg .fgr:first-child{grid-column:1/-1;}
  .res-chara{width:130px;height:130px;} .res-nm{font-size:28px;}
}
</style>
</head>
<body>
<div class="deco"></div>
<div class="wrap">

  <div class="hdr">
    <div class="badge">✨ RPG JOB FORTUNE ✨</div>
    <h1>RPGジョブ<br><em>占い</em></h1>
    <div class="sparks">⚔️ 🔮 👑 😈 🧚</div>
    <p>生年月日から、あなたの<br>RPGジョブがわかる！</p>
  </div>

  <div class="card">
    <div class="card-ttl">🎂 生年月日を入れてね</div>
    <div class="fg">
      <div class="fgr"><label>YEAR 年</label><select id="yr"><option value="">年</option></select></div>
      <div class="fgr"><label>MONTH 月</label><select id="mo"><option value="">月</option></select></div>
      <div class="fgr"><label>DAY 日</label><select id="dy"><option value="">日</option></select></div>
    </div>
    <button class="btn-go" onclick="go()">⚔️ ジョブを診断する！</button>
    <div class="err" id="err">⚠️ 生年月日を全部入力してね！</div>
  </div>

  <div class="res-wrap" id="rw">
    <div class="res-card" id="rc">
      <div class="res-lbl" id="rl">YOUR JOB IS...</div>
      <img class="res-chara" id="ri" src="" alt="" onerror="this.style.display='none';document.getElementById('re').style.display='block'">
      <span class="res-chara-fallback" id="re" style="display:none"></span>
      <div class="res-nm" id="rn"></div>
      <div class="res-tg" id="rt"></div>
      <div class="res-hr" id="rh"></div>
      <div class="res-dc" id="rd"></div>
      <div class="traits" id="tr"></div>
      <div class="cta">
        <p>毎週日曜19:00に、あなたのジョブ専用の<br>週次運勢をnoteで公開しています！</p>
        <a class="btn-n" href="https://note.com/" target="_blank">📖 週次運勢を読む（note）</a>
        <button class="btn-r" onclick="rst()">🔄 もう一度診断する</button>
      </div>
    </div>
  </div>

  <div class="foot">あなたのジョブは生まれた日に刻まれた「魂の資質」✨<br>毎週の運勢はそのジョブに吹く風を伝えるもの。</div>

</div>
<script>
const J=[null,
{n:"勇者",img:"images/勇者.png",e:"⚔️",t:"まっすぐすぎる熱血漢。誰より先に飛び込む！",d:"正義感と責任感が人並み外れて強い。「自分がやらなければ」という使命感で動く。逆境でこそ本領を発揮する！熱くて、一途で、カッコいい。",ts:["行動力","一途","使命感","熱血"],c:"#ef4444",cl:"#fee2e2",cs:"#dc2626",tb:"rgba(239,68,68,.1)",tc:"#dc2626"},
{n:"魔法使い",img:"images/魔法使い.png",e:"🔮",t:"天才肌の変わり者。頭の中はいつも不思議な世界",d:"知的好奇心が行動原理。「面白いかどうか」で判断する。誰も気づかない角度から物事を見る洞察力と圧倒的な専門性が武器！",ts:["洞察力","専門性","論理的","独創的"],c:"#8b5cf6",cl:"#ede9fe",cs:"#6d28d9",tb:"rgba(139,92,246,.1)",tc:"#6d28d9"},
{n:"賢者",img:"images/賢者.png",e:"🌟",t:"すべてを見通す老成した魂。一言が深すぎる",d:"感情的にならず、常に長期的な視点で判断する。本質を見抜く洞察力と深い知識の統合力が強み。内側には深い情熱が眠っている。",ts:["洞察力","冷静","知識","参謀"],c:"#f59e0b",cl:"#fef3c7",cs:"#d97706",tb:"rgba(245,158,11,.1)",tc:"#d97706"},
{n:"僧侶",img:"images/僧侶.png",e:"🙏",t:"誰かのために生きることが喜び。みんなの癒し係",d:"共感力が異常に高く、相手の感情を自分のことのように感じる。チームの空気を整える調整力と温かさが強み。でも自分のことも大切に！",ts:["共感力","優しさ","調整力","献身"],c:"#10b981",cl:"#d1fae5",cs:"#059669",tb:"rgba(16,185,129,.1)",tc:"#059669"},
{n:"忍者",img:"images/忍者.png",e:"🌑",t:"全部わかってるけど、あえて言わない観察者",d:"誰よりも場の空気を読んでいる。状況判断の速さと秘密を守る圧倒的な信頼性が強み。信頼した相手にだけ本当の顔を見せる。",ts:["観察力","信頼性","冷静","忠義"],c:"#374151",cl:"#f3f4f6",cs:"#1f2937",tb:"rgba(55,65,81,.1)",tc:"#374151"},
{n:"アーチャー",img:"images/アーチャー.png",e:"🏹",t:"自由を愛する一匹狼。狙ったら外さない！",d:"縛られることが苦手。目標が定まると驚くほど集中力が上がる。フットワークが軽く、自己管理能力が高い。もっと頼ってもいい！",ts:["集中力","自己管理","自立","精度"],c:"#0ea5e9",cl:"#e0f2fe",cs:"#0284c7",tb:"rgba(14,165,233,.1)",tc:"#0284c7"},
{n:"商人",img:"images/商人.png",e:"💰",t:"チャンスを嗅ぎつける天才。人の縁がお金になる！",d:"人が好きで、人を喜ばせることが得意。自然と人脈が広がり、トレンドを読む先見性とピンチをビジネスに変える発想力が強み！",ts:["交渉力","先見性","人脈","話術"],c:"#ca8a04",cl:"#fef9c3",cs:"#92400e",tb:"rgba(202,138,4,.12)",tc:"#92400e"},
{n:"学者",img:"images/学者.png",e:"📚",t:"「なぜ？」が止まらない探求者。知識量がヤバい",d:"圧倒的な情報収集・分析力と論理的で正確なコミュニケーションが強み。完璧に理解してから動くので、一度動いたら最強！",ts:["分析力","探求心","正確さ","持続力"],c:"#3b82f6",cl:"#dbeafe",cs:"#2563eb",tb:"rgba(59,130,246,.1)",tc:"#1d4ed8"},
{n:"錬金術師",img:"images/錬金術師.png",e:"⚗️",t:"ゼロからイチを生む創造者。発想が宇宙レベル",d:"「変換」が得意。ピンチをチャンスに変える発想力と失敗を恐れない実験精神が強み。誰も見たことのないものを作り出す！",ts:["創造性","実験精神","発明","変換力"],c:"#f97316",cl:"#ffedd5",cs:"#ea580c",tb:"rgba(249,115,22,.1)",tc:"#c2410c"},
{n:"軍師",img:"images/軍師.png",e:"🗺️",t:"10手先を読む戦略家。勝ち筋はもう見えている",d:"常に全体像を把握し、最適な動きを考えている。長期的な戦略立案力とリスクを事前に察知する先読み力が強み。布石を打つのが天才的！",ts:["戦略","先読み","冷静","全体像"],c:"#6366f1",cl:"#e0e7ff",cs:"#4338ca",tb:"rgba(99,102,241,.1)",tc:"#3730a3"},
{n:"王様",img:"images/王様.png",e:"👑",t:"生まれながらのカリスマ。いるだけで場が変わる",d:"場を支配する存在感と大きなビジョンを描く力が強み。本当は「ただの自分」を愛してほしいと思っている。孤独の王には温かい仲間が必要！",ts:["カリスマ","ビジョン","決断力","統率"],c:"#f59e0b",cl:"#fef3c7",cs:"#b45309",tb:"rgba(245,158,11,.15)",tc:"#92400e"},
{n:"踊り子",img:"images/踊り子.png",e:"💃",t:"魅せることで世界を変える。存在が華やかすぎる",d:"感情が豊かで、場の空気を瞬時に変える表現力が強み。「見られたい」の裏に「認めてほしい」という切実な願いがある。",ts:["表現力","感性","情熱","存在感"],c:"#ec4899",cl:"#fce7f3",cs:"#db2777",tb:"rgba(236,72,153,.1)",tc:"#9d174d"},
{n:"大道芸人",img:"images/大道芸人.png",e:"🎪",t:"笑いの裏に哲学を隠す。ムードメーカーの孤独",d:"場を盛り上げ、笑いをとることが得意。ユーモアの裏にある深い洞察力が強み。本当に好きな相手の前ではぎこちなくなる。",ts:["ユーモア","柔軟性","洞察力","自由"],c:"#f97316",cl:"#fff7ed",cs:"#c2410c",tb:"rgba(249,115,22,.12)",tc:"#9a3412"},
{n:"巫女",img:"images/巫女.png",e:"⛩️",t:"見えないものが見える。静かなる感応者",d:"直感と第六感が鋭い。揺るがない内的な軸と人の本音を見抜く力が強み。感じすぎて疲れやすいけど、その感受性こそが最大の才能！",ts:["直感","感受性","洞察","内的軸"],c:"#ef4444",cl:"#fef2f2",cs:"#b91c1c",tb:"rgba(239,68,68,.1)",tc:"#991b1b"},
{n:"妖精",img:"images/妖精.png",e:"🧚",t:"この世のルールを知らない自由な存在。奇跡を起こす",d:"常識に縛られない発想と無邪気な行動力が強み。大人たちが諦めていることに平気で挑戦する。その純粋さが誰かの奇跡になる！",ts:["自由","ひらめき","純粋","チャレンジ"],c:"#10b981",cl:"#ecfdf5",cs:"#047857",tb:"rgba(16,185,129,.1)",tc:"#065f46"},
{n:"魔王",img:"images/魔王.png",e:"😈",t:"圧倒的なカリスマの孤独。悪役には理由がある",d:"圧倒的な存在感と目標達成への執念が強み。強さの裏に、誰かに寄り添ってほしいという切実な願いが隠れている。愛した相手には絶対的な忠誠を誓う。",ts:["カリスマ","執念","洞察力","孤高"],c:"#7c3aed",cl:"#ede9fe",cs:"#5b21b6",tb:"rgba(124,58,237,.12)",tc:"#4c1d95"}
];

const Y=document.getElementById('yr'),M=document.getElementById('mo'),D=document.getElementById('dy');
for(let y=2010;y>=1940;y--){const o=document.createElement('option');o.value=y;o.text=y+'年';Y.appendChild(o);}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.text=m+'月';M.appendChild(o);}
for(let d=1;d<=31;d++){const o=document.createElement('option');o.value=d;o.text=d+'日';D.appendChild(o);}

function go(){
  const y=Y.value,m=M.value,d=D.value;
  const e=document.getElementById('err');
  if(!y||!m||!d){e.style.display='block';return;}
  e.style.display='none';
  const s=(y+m+d).split('').map(Number).reduce((a,b)=>a+b,0);
  const j=J[((s-1)%16)+1];
  const rc=document.getElementById('rc');
  rc.style.borderColor=j.c; rc.style.boxShadow='0 5px 0 '+j.cs;
  const rl=document.getElementById('rl');
  rl.textContent='YOUR JOB IS...'; rl.style.background=j.cl; rl.style.color=j.c;
  const ri=document.getElementById('ri');
  ri.src=j.img; ri.alt=j.n; ri.style.display='block';
  document.getElementById('re').textContent=j.e;
  document.getElementById('re').style.display='none';
  const rn=document.getElementById('rn');
  rn.textContent=j.n; rn.style.color=j.c;
  document.getElementById('rt').textContent='「'+j.t+'」';
  document.getElementById('rh').style.background=j.cl;
  document.getElementById('rd').textContent=j.d;
  const tr=document.getElementById('tr');
  tr.innerHTML='';
  j.ts.forEach(t=>{
    const s=document.createElement('span');
    s.className='trait'; s.textContent='# '+t;
    s.style.background=j.tb; s.style.color=j.tc;
    tr.appendChild(s);
  });
  const rw=document.getElementById('rw');
  rw.style.display='block';
  setTimeout(()=>rw.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function rst(){
  document.getElementById('rw').style.display='none';
  Y.value=''; M.value=''; D.value='';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
