<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#8b5cf6;--purple-l:#ede9fe;--purple-d:#6d28d9;--pink:#ec4899;--text:#2d1b69;--text-m:#7c6fa0;--bg:#faf7ff;--white:#fff;--r:22px}
body{background:var(--bg);color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;min-height:100vh;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(196,181,253,.2);top:-180px;right:-180px}
.deco::after{content:'';position:absolute;width:350px;height:350px;border-radius:50%;background:rgba(251,207,232,.22);bottom:-120px;left:-120px}
.wrap{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:40px 18px 80px}
.hdr{text-align:center;margin-bottom:28px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--purple);color:#fff;font-size:10px;font-weight:800;letter-spacing:.12em;padding:5px 16px;border-radius:20px;margin-bottom:16px}
.hdr h1{font-size:clamp(28px,7vw,42px);font-weight:800;line-height:1.15;margin-bottom:10px}
.hdr h1 em{color:var(--purple);font-style:normal}
.sparks{display:flex;justify-content:center;gap:6px;margin:12px 0;font-size:20px}
.hdr p{font-size:14px;color:var(--text-m);font-weight:500;line-height:1.7}
.card{background:var(--white);border-radius:var(--r);padding:26px 22px;margin-bottom:14px;border:2.5px solid #c4b5fd;box-shadow:0 4px 0 #c4b5fd}
.card-ttl{font-size:13px;font-weight:800;color:var(--purple);letter-spacing:.06em;margin-bottom:18px;text-align:center}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-bottom:18px}
.fgr label{display:block;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.05em;margin-bottom:5px;text-align:center}
.fgr select{width:100%;background:#f5f0ff;border:2px solid #c4b5fd;border-radius:13px;color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;font-size:15px;font-weight:700;padding:10px 6px;outline:none;appearance:none;cursor:pointer;text-align:center;transition:border-color .15s}
.fgr select:focus{border-color:var(--purple)}
.btn-go{width:100%;background:var(--purple);border:none;border-radius:14px;color:#fff;font-family:'M PLUS Rounded 1c',sans-serif;font-size:17px;font-weight:800;padding:15px;cursor:pointer;letter-spacing:.04em;box-shadow:0 5px 0 var(--purple-d);transition:all .1s;position:relative;top:0}
.btn-go:hover{background:#7c3aed}
.btn-go:active{top:3px;box-shadow:0 2px 0 var(--purple-d)}
.err{display:none;color:var(--pink);font-size:13px;font-weight:700;text-align:center;margin-top:11px}
.res-wrap{display:none;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.res-card{background:var(--white);border-radius:var(--r);padding:30px 22px 26px;margin-bottom:14px;text-align:center;border:2.5px solid;box-shadow:0 5px 0}
.res-lbl{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 14px;border-radius:20px;margin-bottom:10px}
.elem-badge{display:inline-block;font-size:12px;font-weight:800;padding:5px 16px;border-radius:20px;margin-bottom:14px}
.res-chara{width:240px;height:240px;object-fit:contain;margin:0 auto 12px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15))}
.res-chara-fallback{font-size:72px;display:block;margin:0 auto 12px;line-height:1}
.res-nm{font-size:32px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.res-catch{font-size:14px;font-weight:800;margin-bottom:8px;line-height:1.5}
.res-tg{font-size:13px;color:var(--text-m);font-weight:500;line-height:1.6;margin-bottom:18px}
.res-hr{height:2.5px;border-radius:2px;margin:0 auto 18px;width:40px}
.res-section{margin-bottom:14px;text-align:left}
.res-section-ttl{font-size:11px;font-weight:800;color:var(--text-m);letter-spacing:.08em;margin-bottom:7px}
.res-dc{font-size:14px;color:var(--text);line-height:1.9;font-weight:500;background:var(--bg);border-radius:14px;padding:14px}
.shadow-box{font-size:13px;color:var(--text);line-height:1.9;font-weight:500;background:#fdf4ff;border:1.5px solid #e9d5ff;border-radius:14px;padding:14px;text-align:left;margin-bottom:14px}
.shadow-box strong{color:var(--purple)}
.rx-box{font-size:13px;color:var(--text);line-height:1.9;font-weight:500;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:14px;padding:14px;text-align:left;margin-bottom:16px}
.rx-box strong{color:#059669}
.traits{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px}
.trait{font-size:12px;font-weight:700;padding:5px 13px;border-radius:20px}
.cta{background:#f5f0ff;border:2px solid #c4b5fd;border-radius:18px;padding:20px;text-align:center}
.cta p{font-size:13px;font-weight:700;color:var(--text-m);line-height:1.7;margin-bottom:14px}
.btn-n{display:block;background:var(--purple);color:#fff;font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px;font-weight:800;padding:13px;border-radius:13px;text-decoration:none;text-align:center;box-shadow:0 4px 0 var(--purple-d);margin-bottom:9px;cursor:pointer;border:none;width:100%;letter-spacing:.03em}
.btn-n:hover{background:#7c3aed}
.btn-r{display:block;background:transparent;color:var(--purple);font-family:'M PLUS Rounded 1c',sans-serif;font-size:13px;font-weight:700;padding:11px;border-radius:13px;text-align:center;border:2px solid #c4b5fd;cursor:pointer;width:100%}
.btn-r:hover{border-color:var(--purple)}
.foot{text-align:center;font-size:12px;color:var(--text-m);font-weight:500;line-height:1.8;margin-top:26px}
@media(max-width:380px){
  .wrap{padding:28px 12px 60px}
  .fg{grid-template-columns:1fr 1fr}
  .fg .fgr:first-child{grid-column:1/-1}
  .res-chara{width:130px;height:130px} .res-nm{font-size:26px}
}
</style>

// 十干マッピング（生まれ年 % 10）
const YJ={0:'ninja',1:'archer',2:'merchant',3:'alchemist',4:'king',5:'miko',6:'hero',7:'dancer',8:'strategist',9:'scholar'};

// 星座 → 属性
function getElem(m,d){
  if((m==3&&d>=21)||(m==4&&d<=19))return'fire';
  if((m==4&&d>=20)||(m==5&&d<=20))return'earth';
  if((m==5&&d>=21)||(m==6&&d<=21))return'air';
  if((m==6&&d>=22)||(m==7&&d<=22))return'water';
  if((m==7&&d>=23)||(m==8&&d<=22))return'fire';
  if((m==8&&d>=23)||(m==9&&d<=22))return'earth';
  if((m==9&&d>=23)||(m==10&&d<=23))return'air';
  if((m==10&&d>=24)||(m==11&&d<=22))return'water';
  if((m==11&&d>=23)||(m==12&&d<=21))return'fire';
  if((m==12&&d>=22)||(m==1&&d<=19))return'earth';
  if((m==1&&d>=20)||(m==2&&d<=18))return'air';
  return'water';
}

const Y=document.getElementById('yr'),M=document.getElementById('mo'),D=document.getElementById('dy');
for(let y=2010;y>=1940;y--){const o=document.createElement('option');o.value=y;o.text=y+'年';Y.appendChild(o);}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.text=m+'月';M.appendChild(o);}
for(let d=1;d<=31;d++){const o=document.createElement('option');o.value=d;o.text=d+'日';D.appendChild(o);}

function go(){
  const y=parseInt(Y.value),m=parseInt(M.value),d=parseInt(D.value);
  const err=document.getElementById('err');
  if(!Y.value||!M.value||!D.value){err.style.display='block';return;}
  err.style.display='none';
  const jk=YJ[y%10],ek=getElem(m,d);
  const j=JOBS[jk],el=ELEMS[ek];
  const fullName=el.n+'の'+j.n;
  const rc=document.getElementById('rc');
  rc.style.borderColor=j.c; rc.style.boxShadow='0 5px 0 '+j.cs;
  const rl=document.getElementById('rl');
  rl.textContent='YOUR JOB IS...'; rl.style.background=j.cl; rl.style.color=j.c;
  const eb=document.getElementById('eb');
  eb.textContent=el.label; eb.style.background=el.bg; eb.style.color=el.color;
  const ri=document.getElementById('ri');
  ri.src='images/'+j.n+'.png'; ri.alt=j.n;
  ri.onload=function(){this.style.display='block';document.getElementById('re').style.display='none';};
  ri.onerror=function(){this.style.display='none';document.getElementById('re').style.display='block';};
  document.getElementById('re').textContent=j.e;
  document.getElementById('re').style.display='none';
  document.getElementById('rn').textContent=fullName;
  document.getElementById('rn').style.color=j.c;
  document.getElementById('rca').textContent=CATCH[jk][ek];
  document.getElementById('rca').style.color=j.c;
  document.getElementById('rt').textContent='「'+j.t+'」';
  document.getElementById('rh').style.background=j.cl;
  document.getElementById('rd').textContent=j.d;
  document.getElementById('edesc').textContent=el.desc;
  document.getElementById('shadow').innerHTML='<strong>🌑 シャドー（影）</strong><br>'+j.shadow;
  document.getElementById('rx').innerHTML='<strong>💊 処方箋</strong><br>'+j.rx;
  const tr=document.getElementById('tr');
  tr.innerHTML='';
  j.ts.forEach(t=>{const s=document.createElement('span');s.className='trait';s.textContent='# '+t;s.style.background=j.tb;s.style.color=j.tc;tr.appendChild(s);});
  const rw=document.getElementById('rw');
  rw.style.display='block';
  setTimeout(()=>rw.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function rst(){
  document.getElementById('rw').style.display='none';
  Y.value=''; M.value=''; D.value='';
  window.scrollTo({top:0,behavior:'smooth'});
}
